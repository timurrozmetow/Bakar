# ─────────────────────────────────────────────────────────────────────────────
# BAKAR — nginx site config for bakar-seeds.com
# Place at: /etc/nginx/sites-available/bakar-seeds.com
# Enable:   ln -s /etc/nginx/sites-available/bakar-seeds.com /etc/nginx/sites-enabled/
#
# IMPORTANT — why HTML is proxied instead of served from disk:
# the Node app injects <title>, description, Open Graph and JSON-LD into index.html
# per route (that is what makes this SPA indexable). Serving client/dist/index.html
# directly from nginx would bypass that and break SEO. Only hashed build assets and
# uploaded files are served straight from disk.
# ─────────────────────────────────────────────────────────────────────────────

upstream bakar_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bakar-seeds.com www.bakar-seeds.com;

    # Let's Encrypt renewal probe must stay on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bakar-seeds.com$request_uri;
    }
}

# ── www → apex ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bakar-seeds.com;

    ssl_certificate     /etc/letsencrypt/live/bakar-seeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakar-seeds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bakar-seeds.com$request_uri;
}

# ── Main site ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bakar-seeds.com;

    ssl_certificate     /etc/letsencrypt/live/bakar-seeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakar-seeds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bakar/client/dist;

    # Uploads are capped at 15 MB in the app — leave a little headroom.
    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    access_log /var/log/nginx/bakar-access.log;
    error_log  /var/log/nginx/bakar-error.log;

    # ── Static build assets (content-hashed → cache forever) ────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg { expires 30d; access_log off; try_files $uri =404; }
    location = /og-image.svg { expires 30d; access_log off; try_files $uri =404; }

    # ── Uploaded originals straight from disk ───────────────────────────────
    location /uploads/ {
        alias /var/www/bakar/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        # never expose the resize cache or other dotted paths
        location ~ /\. { deny all; }
        try_files $uri =404;
    }

    # ── Everything else → Node ──────────────────────────────────────────────
    # HTML routes (meta injection), /api, /img (on-the-fly resize),
    # /sitemap.xml and /robots.txt are all generated by the app.
    location / {
        proxy_pass http://bakar_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Resized images are deterministic — let clients cache them hard.
    location /img/ {
        proxy_pass http://bakar_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
