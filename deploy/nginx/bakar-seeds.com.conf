# ─────────────────────────────────────────────────────────────────────────────
# BAKAR — nginx site config for bakar-seeds.com
#
# Install:
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/bakar-security-headers.conf
#   sudo cp deploy/nginx/proxy.conf            /etc/nginx/snippets/bakar-proxy.conf
#   sudo cp deploy/nginx/bakar-seeds.com.conf  /etc/nginx/sites-available/bakar-seeds.com
#   sudo ln -sf /etc/nginx/sites-available/bakar-seeds.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT — why HTML is proxied instead of served from disk:
# the Node app injects <title>, description, Open Graph and JSON-LD into index.html
# per route (that is what makes this SPA indexable). Serving client/dist/index.html
# directly from nginx would bypass that and break SEO. Only hashed build assets and
# uploaded files are served straight from disk.
#
# Note on `listen ... http2`: written for nginx 1.18/1.24 (Ubuntu 22.04/24.04).
# On nginx >= 1.25.1 you may instead use plain `listen 443 ssl;` plus `http2 on;`.
# ─────────────────────────────────────────────────────────────────────────────

upstream bakar_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bakar-seeds.com www.bakar-seeds.com;

    # Let's Encrypt renewal probe must stay on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bakar-seeds.com$request_uri;
    }
}

# ── www → apex ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bakar-seeds.com;

    ssl_certificate     /etc/letsencrypt/live/bakar-seeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakar-seeds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS must be sent on the redirect too, otherwise the www host never gets pinned.
    include snippets/bakar-security-headers.conf;

    return 301 https://bakar-seeds.com$request_uri;
}

# ── Main site ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bakar-seeds.com;

    ssl_certificate     /etc/letsencrypt/live/bakar-seeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakar-seeds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bakar/client/dist;

    # Uploads are capped at 15 MB in the app — leave a little headroom.
    client_max_body_size 20M;

    include snippets/bakar-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    # Both JavaScript MIME types are listed on purpose: nginx changed the mapping
    # for .js from application/javascript to text/javascript in 1.21.1, and the
    # bundle would silently ship uncompressed if only the other one were named.
    # text/html is always compressed by nginx and needs no entry.
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml application/xml application/manifest+json;

    access_log /var/log/nginx/bakar-access.log;
    error_log  /var/log/nginx/bakar-error.log;

    # ── Static build assets (content-hashed → cache forever) ────────────────
    location /assets/ {
        include snippets/bakar-security-headers.conf;   # re-declared: see snippet header
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Self-hosted webfonts ────────────────────────────────────────────────
    # Filenames are stable rather than content-hashed, so replacing a font means
    # renaming the file — otherwise clients keep the cached copy for a year.
    location /fonts/ {
        include snippets/bakar-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Icons, manifest and other root-level static files ───────────────────
    # Everything else at the root still proxies to Node, so /sitemap.xml,
    # /robots.txt and /llms.txt keep coming from the database.
    location ~* ^/(favicon\.(ico|svg)|favicon-96x96\.png|apple-touch-icon\.png|web-app-manifest-\d+x\d+\.png|site\.webmanifest|og-image\.png)$ {
        include snippets/bakar-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Uploaded originals straight from disk ───────────────────────────────
    # nosniff here matters: these are user-uploaded bytes served by nginx, which
    # never passes through helmet.
    location /uploads/ {
        alias /var/www/bakar/server/uploads/;
        include snippets/bakar-security-headers.conf;
        add_header Cache-Control "public" always;
        expires 30d;
        access_log off;
        # never expose the resize cache or other dotted paths
        location ~ /\. { deny all; }
        try_files $uri =404;
    }

    # ── Resized images (deterministic → cache hard) ─────────────────────────
    location /img/ {
        proxy_pass http://bakar_api;
        include snippets/bakar-proxy.conf;
        include snippets/bakar-security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        access_log off;
    }

    # ── Everything else → Node ──────────────────────────────────────────────
    # HTML routes (meta injection), /api, /sitemap.xml and /robots.txt.
    location / {
        proxy_pass http://bakar_api;
        include snippets/bakar-proxy.conf;
    }
}
