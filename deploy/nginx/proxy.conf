# Shared proxy settings for requests forwarded to the Node app.
# Install at: /etc/nginx/snippets/bakar-proxy.conf
#
# Same inheritance trap as add_header: declaring ANY proxy_set_header inside a
# location discards the ones from the enclosing level. Keeping them together in
# one snippet means every proxying location gets the complete set.
#
# Express runs with app.set('trust proxy', 1), so X-Forwarded-For drives the rate
# limiter and X-Forwarded-Proto drives req.protocol (used to build absolute URLs).
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
