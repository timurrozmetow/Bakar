# Shared security headers for bakar-seeds.com.
# Install at: /etc/nginx/snippets/bakar-security-headers.conf
#
# WHY THIS IS A SEPARATE FILE: nginx inherits add_header from the parent level only
# when the current level declares NO add_header of its own. Every location that sets
# its own Cache-Control would therefore silently drop these headers, so each one
# includes this snippet explicitly.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
