<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Apply the saved theme before first paint. Without this, <html> ships
         data-theme="light" and ThemeProvider only switches to dark in a
         post-mount effect, so a dark-mode visitor sees a light flash (loader
         and content) on every cold load. ThemeProvider then just keeps sync. -->
    <script>
      try {
        var t = localStorage.getItem('bakar_theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bakar" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10794a" />
    <meta name="description" content="BAKAR — простые продукты, сделанные добросовестно. Крупы, макароны, бобовые, рис, хлопья, семечки. Halal, без ГМО, без глютена. Туркменистан." />
    <!-- Stolzl is self-hosted (see index.css) — no third-party font connection.
         All three weights appear above the fold: Regular in body copy, Bold in
         headings, Medium in the navigation and buttons. Medium was left out of
         the preload at first and, being discoverable only after the stylesheet
         parsed, ended up 724 ms deep in the critical chain. -->
    <link rel="preload" href="/fonts/stolzl-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/stolzl-medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/stolzl-bold.woff2" as="font" type="font/woff2" crossorigin />
    <title>BAKAR — простые продукты, сделанные добросовестно</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
