<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#10794a" />
    <meta name="description" content="BAKAR — простые продукты, сделанные добросовестно. Крупы, макароны, бобовые, рис, хлопья, семечки. Halal, без ГМО, без глютена. Туркменистан." />
    <!-- Manrope is self-hosted (see index.css) — no third-party font connection.
         All three subsets are preloaded because every page shows them together:
         Cyrillic body copy, the Latin wordmark, and Turkmen diacritics in the
         kicker and marquee (ý, ş, ň) which live in latin-ext. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <title>BAKAR — простые продукты, сделанные добросовестно</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
